<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | CoreX Montreal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0c0f14;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .error-code {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(80px, 20vw, 160px);
            font-weight: 900;
            color: #a61e2b;
            line-height: 1;
            text-shadow: 0 0 40px rgba(166, 30, 43, 0.5);
        }
        .error-title {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(18px, 4vw, 28px);
            font-weight: 800;
            text-transform: uppercase;
            margin: 16px 0 8px;
        }
        .error-msg {
            font-size: 15px;
            color: #9ca3af;
            margin-bottom: 32px;
            max-width: 420px;
        }
        .btn-home {
            display: inline-block;
            background: #a61e2b;
            color: #fff;
            padding: 14px 32px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(166, 30, 43, 0.4);
        }
        .btn-home:hover {
            background: #c42635;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(166, 30, 43, 0.6);
        }
        .logo {
            height: 40px;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 15px rgba(166, 30, 43, 0.4));
        }
    </style>
</head>
<body>
    <div>
        <img src="/corex/assets/corex_logo.png" alt="CoreX" class="logo" onerror="this.style.display='none'">
        <div class="error-code">404</div>
        <h1 class="error-title">SYSTEM OVERLOAD</h1>
        <p class="error-msg">This page doesn't exist or has been moved. Let's get you back to building your ultimate rig.</p>
        <a href="/corex/" class="btn-home">Back to Home</a>
    </div>
</body>
</html>
